name: Product verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Installer copy gate before any repairing Make target
        run: cmp install.sh cmd/console/join.sh
      - name: Shell entry points
        run: |
          bash -n install.sh
          bash -n cmd/console/join.sh
          bash -n hack/dev/fabric.sh
          bash -n hack/dev/test.sh
          bash -n hack/dev/snap.sh
          bash -n hack/lab/reload.sh
          bash -n hack/publish.sh
          bash -n hack/release.sh
          bash -n hack/kata-render.sh
          bash -n hack/dev/recovery.sh
          bash -n hack/dev/host-recovery.sh
          bash -n cmd/console/testdata/firewall-gate.sh
      - name: Recovery runner safety and evidence checks
        run: python3 -m unittest discover -s hack/dev -p test_recovery_runner.py -v
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Disposable host reload behavior
        run: go test ./hack/lab -count=1
      - name: Cross-architecture distribution
        run: make dist
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: pip install Jinja2==3.1.6 PyYAML==6.0.3 MarkupSafe==3.0.4
      - run: python3 -m unittest discover -s hack -p 'test_catalog_import.py'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./cmd/console -run 'Test.*Catalog' -count=1
  mac-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the supported native architecture
        run: test "$(uname -m)" = arm64
      - name: Native tests including NoCloud ISO inspection
        working-directory: mac
        run: swift test
  integration:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Require provisioned Docker storage
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess
          info = json.loads(subprocess.check_output(['docker', 'info', '--format', '{{json .}}'], text=True))
          root = info['DockerRootDir']
          disk = shutil.disk_usage(root)
          free = disk.free
          capacity = {
              'architecture': platform.machine(),
              'kernel': platform.release(),
              'docker_cpus': info['NCPU'],
              'docker_memory_bytes': info['MemTotal'],
              'docker_storage_driver': info['Driver'],
              'docker_cgroup_version': info['CgroupVersion'],
              'docker_root': root,
              'docker_total_bytes': disk.total,
              'docker_free_bytes': free,
              'required_free_bytes': 30 * 1024**3,
              'kvm_device_present': os.path.exists('/dev/kvm'),
              'kvm_accessible_to_runner': os.access('/dev/kvm', os.R_OK | os.W_OK),
          }
          inotify = pathlib.Path('/proc/sys/fs/inotify/max_user_instances')
          if inotify.exists():
              capacity['inotify_max_user_instances'] = int(inotify.read_text())
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wecolab-recovery' / 'runner-capacity.json'
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps(capacity, indent=2) + '\n')
          print(json.dumps(capacity, indent=2), flush=True)
          if free < 30 * 1024**3:
              raise SystemExit(f'Disposable recovery runner needs 30 GiB free in Docker storage; has {free / 1024**3:.1f} GiB. No automatic prune.')
          PY
      - name: Credential-free disposable fabric recovery and integration
        run: |
          set -euo pipefail
          export WECOLAB_DEV_PREFIX="rec-$(openssl rand -hex 6)"
          export WECOLAB_DEV_OWNER="ci-$(openssl rand -hex 16)"
          export WECOLAB_RECOVERY_ARTIFACTS="$RUNNER_TEMP/wecolab-recovery"
          export WECOLAB_DEV_SUBNET="$(python3 - <<'PY'
          import ipaddress, json, secrets, subprocess
          names = subprocess.check_output(['docker', 'network', 'ls', '-q'], text=True).split()
          existing = []
          if names:
              for network in json.loads(subprocess.check_output(['docker', 'network', 'inspect', *names])):
                  existing.extend(ipaddress.ip_network(config['Subnet'], strict=False)
                                  for config in (network['IPAM'].get('Config') or []) if config.get('Subnet'))
          candidates = [ipaddress.ip_network(f'198.19.{n}.0/24') for n in range(256)]
          candidates = [n for n in candidates if not any(n.overlaps(used) for used in existing)]
          if not candidates:
              raise SystemExit('no unused isolated subnet available')
          print(secrets.choice(candidates))
          PY
          )"
          trap 'hack/dev/fabric.sh down' EXIT
          hack/dev/fabric.sh up
          for scenario in failed-backup recreate name-race replay-lag partition; do
            hack/dev/recovery.sh "$scenario"
            if [[ "$scenario" == failed-backup || "$scenario" == replay-lag || "$scenario" == partition ]]; then
              docker cp install.sh "$WECOLAB_DEV_PREFIX-pub:/root/install.sh"
              docker exec "$WECOLAB_DEV_PREFIX-pub" bash /root/install.sh takeover
              for attempt in $(seq 1 60); do
                if docker exec "$WECOLAB_DEV_PREFIX-pub" curl -fsSk -H 'Host: console.dev.wecolab.test' https://127.0.0.1/api/settings |
                   jq -e '.site == "pub" and .writer == "pub" and .isWriter == true' >/dev/null; then break; fi
                if [[ "$attempt" == 60 ]]; then exit 1; fi
                sleep 5
              done
            fi
          done
          hack/dev/fabric.sh test
      - name: Retain sanitized success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wecolab-recovery/**/result.json
            ${{ runner.temp }}/wecolab-recovery/runner-capacity.json
          if-no-files-found: error
          retention-days: 30
