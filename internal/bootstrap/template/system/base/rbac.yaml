# What people may do at a site (Warden binds them from Member records; the Console's dry runs are
# checked against these), and what Flux may create when it applies a project's apps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: wecolab-reader }
rules:
  - apiGroups: [wecolab.io]
    resources: [sites, members, offers, pools, domains, apps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: wecolab-project-member }
rules:
  - apiGroups: [wecolab.io]
    resources: [apps]
    verbs: ["*"]
  - apiGroups: ["", apps, batch]
    resources: [deployments, statefulsets, jobs, cronjobs, services, secrets, configmaps, persistentvolumeclaims, pods, pods/log, events]
    verbs: ["*"]
  - apiGroups: [postgresql.cnpg.io, barmancloud.cnpg.io]
    resources: [clusters, scheduledbackups, backups, objectstores]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: wecolab-apply }
rules:
  - apiGroups: ["", apps, batch]
    resources: [deployments, statefulsets, jobs, cronjobs, services, secrets, configmaps, persistentvolumeclaims]
    verbs: ["*"]
  - apiGroups: [postgresql.cnpg.io, barmancloud.cnpg.io]
    resources: [clusters, scheduledbackups, objectstores]
    verbs: ["*"]
