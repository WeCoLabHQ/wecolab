# This site's copy of the Fabric. The join script applies it first; Flux keeps it after. Reached by
# the other sites on the manager's Nebula address, port 30300 (node ports listen only on Nebula).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo
  namespace: wecolab-system
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: forgejo, namespace: wecolab-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: forgejo } }
  template:
    metadata: { labels: { app: forgejo } }
    spec:
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0.9-rootless
          env:
            - { name: FORGEJO__server__ROOT_URL, value: "http://forgejo.wecolab-system.svc:3000/" }
            - { name: FORGEJO__server__HTTP_PORT, value: "3000" }
            - { name: FORGEJO__server__DISABLE_SSH, value: "true" }
            - { name: FORGEJO__server__OFFLINE_MODE, value: "true" }
            - { name: FORGEJO__security__INSTALL_LOCK, value: "true" }
            - { name: FORGEJO__security__SECRET_KEY__FILE, value: /secret/secret-key }
            - { name: FORGEJO__service__DISABLE_REGISTRATION, value: "true" }
            - { name: FORGEJO__service__REQUIRE_SIGNIN_VIEW, value: "true" }
            - { name: FORGEJO__repository__DEFAULT_PRIVATE, value: private }
            - { name: FORGEJO__database__DB_TYPE, value: sqlite3 }
            - { name: FORGEJO__migrations__ALLOW_LOCALNETWORKS, value: "true" }
            - { name: FORGEJO__webhook__ALLOWED_HOST_LIST, value: private }
            - { name: FORGEJO__mirror__MIN_INTERVAL, value: 2m }
            - { name: FORGEJO__cron_0X2E_update_mirrors__SCHEDULE, value: "@every 1m" }
            - { name: FORGEJO__log__LEVEL, value: Warn }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea, subPath: data }
            - { name: secret, mountPath: /secret, readOnly: true }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /api/healthz, port: 3000 } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: forgejo } }
        - { name: secret, secret: { secretName: forgejo } }
---
apiVersion: v1
kind: Service
metadata: { name: forgejo, namespace: wecolab-system }
spec:
  type: NodePort
  selector: { app: forgejo }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
